{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<style>
/* ── Cards ─────────────────────────────────────────────── */
.carreta-cards {
  display: flex; flex-wrap: wrap; gap: 12px;
  margin-bottom: 20px; max-width: 100%;
}
.carreta-card {
  flex: 1; min-width: 140px;
  background: var(--f16-card, #fff);
  border: 1px solid var(--f16-border, #e5e7eb);
  border-radius: 10px; padding: 14px 18px;
}
.carreta-card .lbl {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: var(--f16-text-muted, #6b7280); margin-bottom: 4px;
}
.carreta-card .val {
  font-size: 32px; font-weight: 800;
  color: var(--f16-text, #111827); line-height: 1;
}
.carreta-card .sub {
  font-size: 11px; color: var(--f16-text-muted, #6b7280); margin-top: 3px;
}
.carreta-card.verde .val  { color: #15803d; }
.carreta-card.azul  .val  { color: #1e40af; }
.carreta-card.cinza .val  { color: #6b7280; }

/* ── Largura das colunas da tabela ─────────────────────── */
#result_list th.column-placa,
#result_list td.field-placa          { width: 90px;  white-space: nowrap; }
#result_list th.column-marca,
#result_list td.field-marca          { width: 130px; }
#result_list th.column-tipo_display,
#result_list td.field-tipo_display   { width: 120px; white-space: nowrap; }
#result_list th.column-ano,
#result_list td.field-ano            { width: 55px;  text-align: center; }
#result_list th.column-classificacao,
#result_list td.field-classificacao  { width: 110px; }
#result_list
